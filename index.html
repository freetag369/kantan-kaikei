<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>かんたん会計</title>
  <meta name="description" content="個人とビジネスを切り替えて使えるシンプル家計簿">
  <meta name="theme-color" content="#f6f5f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17181c" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="かんたん会計">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div id="app">
    <main id="views">
      <section class="view active" id="view-input" aria-label="入力"></section>
      <section class="view" id="view-calendar" aria-label="カレンダー"></section>
      <section class="view" id="view-report" aria-label="レポート"></section>
      <section class="view" id="view-budget" aria-label="予算"></section>
      <section class="view" id="view-menu" aria-label="メニュー"></section>
    </main>

    <nav id="tabbar" aria-label="メインナビゲーション">
      <button class="tab-btn active" data-tab="input">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m16.8 3.8 3.4 3.4L8.5 18.9 4 20l1.1-4.5Z"/></svg>
        <span>入力</span>
      </button>
      <button class="tab-btn" data-tab="calendar">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="M7.5 13h1M11.5 13h1M15.5 13h1M7.5 17h1M11.5 17h1M15.5 17h1"/></svg>
        <span>カレンダー</span>
      </button>
      <button class="tab-btn" data-tab="report">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5H12Z"/><path d="M14.5 2.5a8 8 0 0 1 7 7h-7Z"/></svg>
        <span>レポート</span>
      </button>
      <button class="tab-btn" data-tab="budget">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2.5"/><path d="M3 9.5h13a2 2 0 0 1 2 2v0a2 2 0 0 1-2 2H3M16.5 6V4.8a1.3 1.3 0 0 0-1.6-1.2L4 6"/><circle cx="16" cy="11.5" r=".6"/></svg>
        <span>予算</span>
      </button>
      <button class="tab-btn" data-tab="menu">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg>
        <span>メニュー</span>
      </button>
    </nav>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
